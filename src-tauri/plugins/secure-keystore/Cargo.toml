[package]
edition = "2021"
rust-version = "1.77.2"
name = "tauri-plugin-secure-keystore"
version = "0.0.2"
authors = ["Abdullah <abdullah72308@gmail.com>"]
build = "build.rs"
links = "tauri-plugin-secure-keystore"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Encrypted key-value storage backed by the Android Keystore, iOS Keychain, and the desktop OS credential store, with no biometric-enrollment requirement."
readme = "README.md"
keywords = [
    "tauri",
    "keystore",
    "keychain",
    "android",
    "ios",
]
categories = [
    "gui",
    "os::android-apis",
    "cryptography",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Abdullah-5603/tauri-plugin-secure-keystore"

[lib]
name = "tauri_plugin_secure_keystore"
path = "src/lib.rs"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.tauri]
version = "2"

[dependencies.thiserror]
version = "2"

[build-dependencies.tauri-plugin]
version = "2"
features = ["build"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.keyring]
version = "4"

[target.'cfg(target_os = "ios")'.dependencies.tauri]
version = "2"
features = ["wry"]
